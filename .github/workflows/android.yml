name: PublicBS Android APK

on:
workflow_dispatch:
push:
paths:
- 'PublicBS-Unity.zip'
- '.github/workflows/android.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Extract Unity Project
    run: |
      mkdir -p UnityProject
      unzip -o PublicBS-Unity.zip -d UnityProject

  - name: Build Android APK
    uses: game-ci/unity-builder@v4
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    with:
      projectPath: UnityProject/PublicBS-Unity
      unityVersion: 2022.3.62f1
      targetPlatform: Android
      buildMethod: PublicBS.Editor.ProjectBuild.BuildAndroid
      allowDirtyBuild: true

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: PublicBS-Android
      path: build/Android
      if-no-files-found: error
